version: '3'

services:
  frontend:
    container_name: ecommerce-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '3000:80' # Assuming the frontend is served on port 80 inside the container
    environment:
      - NODE_ENV=production

  backend:
    container_name: ecommerce-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - type: bind
        source: ./backend
        target: /app
      - type: bind
        source: ./backend/staticfiles
        target: /app/staticfiles
    ports:
      - '8000:8000'
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=ecommerce.settings
    command: daphne -b 0.0.0.0 -p 8000 ecommerce.asgi:application

  redis:
    container_name: ecommerce-redis
    image: redis
    ports:
      - '6379:6379'

  db:
    container_name: ecommerce-db
    image: postgres:latest
    env_file:
      - ./backend/.env
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: ['postgres', '-c', 'shared_preload_libraries=pg_stat_statements']

volumes:
  postgres_data:
